name: Build Foundry Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify tag and manifest version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./module.json').version")"
          tag_version="${RELEASE_TAG#v}"

          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "::error::module.json version ($manifest_version) does not match tag ($RELEASE_TAG)."
            exit 1
          fi

      - name: Build module archive
        shell: bash
        run: |
          zip -r addiction-recovery-system.zip \
            module.json \
            README.md \
            assets \
            lang \
            scripts \
            styles \
            templates

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              module.json \
              addiction-recovery-system.zip \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              module.json \
              addiction-recovery-system.zip \
              --title "Addiction Recovery System $RELEASE_TAG" \
              --generate-notes
          fi
