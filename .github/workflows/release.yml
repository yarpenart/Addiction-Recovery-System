name: Build Foundry Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag and manifest version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./module.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "::error::module.json version ($manifest_version) does not match tag ($GITHUB_REF_NAME)."
            exit 1
          fi

      - name: Build module archive
        shell: bash
        run: |
          zip -r addiction-recovery-system.zip \
            module.json \
            README.md \
            lang \
            scripts \
            styles \
            templates

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            module.json \
            addiction-recovery-system.zip \
            --title "Addiction Recovery System $GITHUB_REF_NAME" \
            --generate-notes
